name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pipenv==2026.6.1
      - run: pipenv verify
      - run: pipenv sync --dev
      - run: pipenv run lint
      - run: pipenv run format --check
      - run: pipenv run test
      # Touchline+ Phase 5: evaluation harness subset with the offline (rule-based) model.
      - run: pipenv run python -m eval.run --subset ci --configs langgraph/offline --out "$RUNNER_TEMP/eval" --no-human-export
        env:
          GAME_RAG_EMBEDDER: hash
